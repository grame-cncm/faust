name: libfaust

env:
  FAUST_VERSION: 2.90.14
  FAUSTGEN_VERSION: "1.86"
  CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
  # The LLVM version is chosen in .github/llvm/release.env: every job builds
  # with the package of that release (see build-llvm.yml and
  # .github/actions/fetch-llvm), checked against .github/llvm/SHA256SUMS.

# Controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      create_release:
        type: boolean
        description: Create a draft release
        default: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  config:
    runs-on: ubuntu-24.04
    outputs:
      manylinux-tag: ${{ steps.read.outputs.manylinux-tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/llvm

    - name: Read release.env
      id: read
      run: |
        set -euo pipefail
        . .github/llvm/release.env
        test -n "$MANYLINUX_TAG"
        echo "manylinux-tag=$MANYLINUX_TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64
            os: ubuntu-24.04
            llvm-platform: linux-x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - name: ubuntu-aarch64
            os: ubuntu-24.04-arm
            llvm-platform: linux-aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64

    runs-on: ${{ matrix.os }}
    # The image of the LLVM build: one toolchain for LLVM and libfaust, and a
    # libfaust.so that needs glibc 2.28 only.
    container: ${{ matrix.image }}:${{ needs.config.outputs.manylinux-tag }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Install dependencies
      run: |
        set -euo pipefail
        yum install -y git zip pkgconfig libmicrohttpd-devel
        /opt/python/cp312-cp312/bin/python -m pip install cmake==3.31.6
        echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

    - uses: actions/checkout@v4
      with:
        submodules: true

    # checkout only trusts the repository for its own step; in the container
    # (root, files of the runner user) git refuses it afterwards, and the
    # build cannot name its source commit.
    - name: Trust the repository
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: ./.github/actions/fetch-llvm
      with:
        platform: ${{ matrix.llvm-platform }}

    - name: Build libfaust
      run: |
        set -euo pipefail
        cd build
        cmake -C ./backends/all.cmake . -Bbuild -DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DINCLUDE_DYNAMIC=ON -DINCLUDE_STATIC=ON -DINCLUDE_LLVM=ON -DUSE_LLVM_CONFIG=ON \
          -DLLVM_CONFIG="$LLVM_CONFIG" -DLLVM_REQUIRED_VERSION="$LLVM_REQUIRED_VERSION" \
          -DLLVM_FORBID_ASSERTIONS="$LLVM_FORBID_ASSERTIONS"
        # A bare --parallel is an unbounded make -j with this generator: it
        # starves the runner of memory.
        cmake --build build --config Release --parallel "$(nproc)"

    - name: Check libfaust
      run: |
        set -euo pipefail
        build/bin/faust --version | tee faust-version.txt
        grep -Fx "Build with LLVM version $LLVM_REQUIRED_VERSION" faust-version.txt
        # The binary names the commit it was built from, from an unmodified tree.
        grep -Fx "Source commit: $(git rev-parse --short=9 HEAD)" faust-version.txt
        lib=$(ls build/lib/libfaust.so.* | sort -V | tail -n1)
        if ldd "$lib" | grep -i llvm; then
          echo "::error::$lib depends on a shared LLVM"
          exit 1
        fi
        c++ -std=c++17 -O1 -Iarchitecture .github/llvm/libfaust-smoke.cpp -o libfaust-smoke \
          -Lbuild/lib -lfaust -Wl,-rpath,"$PWD/build/lib"
        ./libfaust-smoke run
        ./libfaust-smoke write "$RUNNER_TEMP/smoke.machine"
        ./libfaust-smoke read "$RUNNER_TEMP/smoke.machine"

    - name: Make distribution
      run: |
        cd build/lib
        rm -f libfaust.so libfaust.so.2
        newest=$(ls -1 libfaust.so.* | tail -n1)
        mv "$newest" libfaust.so
        strip --strip-unneeded libfaust.so
        cd ..
        zip -r libfaust-${{ matrix.name }}.zip lib

    - name: Upload libfaust artifact
      uses: actions/upload-artifact@v4
      with:
        name: libfaust-${{ matrix.name }}.zip
        path: build/libfaust-${{ matrix.name }}.zip
        if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            os: macos-15
            llvm-platform: macos-arm64
            ARCHS: "-arch arm64"
            CMAKE_OSX_ARCHITECTURES: arm64
            HOST: aarch64-apple-darwin
            ENABLE_MPEG: OFF
          - name: x64
            os: macos-15-intel
            llvm-platform: macos-x86_64
            ARCHS: "-arch x86_64"
            CMAKE_OSX_ARCHITECTURES: x86_64
            HOST: x86_64-apple-darwin
            ENABLE_MPEG: ON
   
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: ./.github/actions/fetch-llvm
      with:
        platform: ${{ matrix.llvm-platform }}

    - name: Build libmicrohttpd
      run: |
        curl -L https://mirror.cyberbits.eu/gnu/libmicrohttpd/libmicrohttpd-1.0.2.tar.gz -o libmicrohttpd-1.0.2.tar.gz
        tar -xvf libmicrohttpd-1.0.2.tar.gz
        mv libmicrohttpd-1.0.2 libmicrohttpd
        cd libmicrohttpd
        export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
        export TARGET=${{matrix.HOST}}
        export CC=$(xcrun -find -sdk macosx gcc)
        export CFLAGS="${{matrix.ARCHS}} -target $TARGET -isysroot $SDKROOT -mmacosx-version-min=10.15"
        export LDFLAGS="${{matrix.ARCHS}} -target $TARGET -isysroot $SDKROOT"
        ./configure --enable-https=no --host=$TARGET --prefix=$PWD/libmicrohttpd
        make && make install

    - name: Brew install requirements (arm64)
      if: ${{ endsWith( matrix.name, 'arm64') }}
      # Install via formula names; use bottles when available. Avoid passing .tar.gz paths.
      run: |
        brew update

        PACKAGES=(ncurses gtk+ liblo lame flac libogg libtool libvorbis opus mpg123)

        # Pull deps first so they come from bottles too
        DEPS=($(brew deps --union --topological "${PACKAGES[@]}" | tr '\n' ' '))
        PACKAGES=("${DEPS[@]}" "${PACKAGES[@]}")

        # Keep CI fast/quiet and avoid auto-changes
        export HOMEBREW_NO_INSTALL_CLEANUP=1
        export HOMEBREW_NO_INSTALL_UPGRADE=1
        export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
        export HOMEBREW_NO_ENV_HINTS=1
        export HOMEBREW_NO_ANALYTICS=1
        export HOMEBREW_NO_AUTO_UPDATE=1

        for PACKAGE in "${PACKAGES[@]}"; do
          echo "Fetching bottle (if available): $PACKAGE"
          brew fetch --force-bottle "$PACKAGE" || true

          echo "Installing from bottle (if available): $PACKAGE"
          brew reinstall --force-bottle "$PACKAGE" || brew install --force-bottle "$PACKAGE" || true
        done

        # Optional slimming: remove large tools not needed at runtime
        brew uninstall --ignore-dependencies curl git || true

    - name: Brew install requirements (x64)
      if: ${{ endsWith( matrix.name, 'x64') }}
      run: brew install pkg-config ncurses gtk+ liblo lame flac libogg libtool libvorbis opus mpg123

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'mac'
        target: 'desktop'
        dir: '${{ github.workspace }}/qt_install'
        # tools: 'tools_ifw tools_qtcreator,qt.tools.qtcreator'

    - name: Clone Libsndfile
      uses: actions/checkout@v4
      with:
        repository: libsndfile/libsndfile
        path: libsndfile
        submodules: true

    - name: Build libsndfile
      # Note that can't use the libsndfile from brew because it lacks libsndfile.a, the static lib.
      run: |
        # Only uninstall if it's actually installed, to avoid "No such keg" failures
        if brew list --versions libsndfile >/dev/null 2>&1; then
          brew uninstall --ignore-dependencies libsndfile >/dev/null 2>&1
        fi
        
        cd libsndfile
        LIBSNDFILE_INSTALL_PREFIX="$PWD/install"
        mkdir CMakeBuild && cd CMakeBuild
        cmake .. -G "Unix Makefiles" -DCMAKE_INSTALL_PREFIX="$LIBSNDFILE_INSTALL_PREFIX" -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_OSX_ARCHITECTURES=$CMAKE_OSX_ARCHITECTURES -DCMAKE_OSX_DEPLOYMENT_TARGET=$CMAKE_OSX_DEPLOYMENT_TARGET -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DENABLE_MPEG=${{ matrix.ENABLE_MPEG }}
        make && make install
        otool -L $LIBSNDFILE_INSTALL_PREFIX/lib/libsndfile.a
        echo "Testing pkg-config for sndfile"
        export PKG_CONFIG_PATH="$LIBSNDFILE_INSTALL_PREFIX/lib/pkgconfig"
        pkg-config --cflags sndfile
      env:
        CMAKE_OSX_ARCHITECTURES: ${{matrix.CMAKE_OSX_ARCHITECTURES}}

    - name: Clone MAX SDK
      uses: actions/checkout@v4
      with:
        repository: Cycling74/max-sdk-base
        path: max-sdk-base

    # - name: Clone faustlive
    #   uses: actions/checkout@v4
    #   with:
    #     repository: grame-cncm/faustlive
    #     path: faustlive

    - name: Build everything
      # todo: do we need to specify the qt@5 path for PKG_CONFIG_PATH?
      run: |  
        export PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig:$PWD/libsndfile/install/lib/pkgconfig:$PWD/libmicrohttpd/libmicrohttpd/lib/pkgconfig"

        # LLVM_CONFIG, LLVM_REQUIRED_VERSION and LLVM_FORBID_ASSERTIONS come
        # from fetch-llvm; LLVM is the link line of the tools (tools/benchmark).
        export LLVM="$("$LLVM_CONFIG" --link-static --ldflags --libs all --system-libs | tr '\n' ' ')"

        export FAUSTLIVE=$PWD/faustlive
        export BUILD_HTTP_STATIC=ON
        export USE_STATIC_SNDFILE=1
        export CMAKEOPT="-DCMAKE_OSX_ARCHITECTURES="$CMAKE_OSX_ARCHITECTURES" -DCMAKE_OSX_DEPLOYMENT_TARGET=$CMAKE_OSX_DEPLOYMENT_TARGET -DCMAKE_BUILD_TYPE=Release"
        export INCLUDE_LLVM=ON
        export USE_LLVM_CONFIG=ON
    
        cd build
        make release

        cd Release-${{env.FAUST_VERSION}}
        cp Faust-${{env.FAUST_VERSION}}.dmg Faust-${{env.FAUST_VERSION}}-${{matrix.name}}.dmg
        cp faustgen-${{env.FAUSTGEN_VERSION}}-macosx.dmg faustgen-${{env.FAUSTGEN_VERSION}}-${{matrix.name}}.dmg
      env:
        CMAKE_OSX_ARCHITECTURES: ${{matrix.CMAKE_OSX_ARCHITECTURES}}
        ARCHS: ${{matrix.ARCHS}}

    - name: Check libfaust
      run: |
        set -euo pipefail
        build/bin/faust --version | tee faust-version.txt
        grep -Fx "Build with LLVM version $LLVM_REQUIRED_VERSION" faust-version.txt
        # The binary names the commit it was built from, from an unmodified tree.
        grep -Fx "Source commit: $(git rev-parse --short=9 HEAD)" faust-version.txt
        for lib in build/lib/libfaust*.dylib; do
          if otool -L "$lib" | tail -n +2 | grep -i llvm; then
            echo "::error::$lib depends on a shared LLVM"
            exit 1
          fi
        done
        c++ -std=c++17 -O1 ${{ matrix.ARCHS }} -Iarchitecture .github/llvm/libfaust-smoke.cpp -o libfaust-smoke \
          -Lbuild/lib -lfaust -Wl,-rpath,"$PWD/build/lib"
        ./libfaust-smoke run
        ./libfaust-smoke write "$RUNNER_TEMP/smoke.machine"
        ./libfaust-smoke read "$RUNNER_TEMP/smoke.machine"

    - name: Upload Faust artifact
      uses: actions/upload-artifact@v4
      with:
        name: faust-${{env.FAUST_VERSION}}-${{ matrix.name }}.dmg
        path: build/Release-${{env.FAUST_VERSION}}/Faust-${{env.FAUST_VERSION}}-${{matrix.name}}.dmg
        if-no-files-found: error

    - name: Upload Faust source artifact
      if: ${{ endsWith( matrix.name, 'arm64') }}
      uses: actions/upload-artifact@v4
      with:
        name: faust-${{env.FAUST_VERSION}}.tar.gz
        path: build/Release-${{env.FAUST_VERSION}}/faust-${{env.FAUST_VERSION}}.tar.gz
        if-no-files-found: error

    - name: Upload faustgen~ artifact
      uses: actions/upload-artifact@v4
      with:
        name: faustgen-${{env.FAUSTGEN_VERSION}}-${{ matrix.name }}.dmg
        path: build/Release-${{env.FAUST_VERSION}}/faustgen-${{env.FAUSTGEN_VERSION}}-${{matrix.name}}.dmg
        if-no-files-found: error

  build-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: win64
            os: windows-2022
            libsndfile-url: https://github.com/libsndfile/libsndfile/releases/download/1.2.0/libsndfile-1.2.0-win64.zip

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    
    - uses: ilammy/msvc-dev-cmd@v1

    - uses: ./.github/actions/fetch-llvm
      with:
        platform: windows-x64

    - name: Download Libsndfile
      run: |
        curl -L ${{ matrix.libsndfile-url }} -o libsndfile.zip
        7z x libsndfile.zip -y
        mv libsndfile-1.2.0-win64 libsndfile

    # todo: remove windows/libmicrohttpd from repo and use dynamically downloaded version
    # - name: Download libmicrohttpd
    #   run: |
    #     curl -L https://ftpmirror.gnu.org/libmicrohttpd/libmicrohttpd-latest-w32-bin.zip -o libmicrohttpd.zip
    #     7z x libmicrohttpd.zip -y

    - name: Clone Max SDK
      uses: actions/checkout@v4
      with:
        repository: Cycling74/max-sdk-base
        path: max-sdk-base
        
    - name: Build libfaust
      shell: cmd
      run: |
        cd build
        call MakeRelease.bat
        IF ERRORLEVEL 1 EXIT /B 1

    - name: Check libfaust
      shell: bash
      run: |
        set -euo pipefail
        build/build/faust/bin/faust.exe --version | tr -d '\r' | tee faust-version.txt
        grep -Fx "Build with LLVM version $LLVM_REQUIRED_VERSION" faust-version.txt
        # The binary names the commit it was built from, from an unmodified tree.
        grep -Fx "Source commit: $(git rev-parse --short=9 HEAD)" faust-version.txt
        for dll in $(find build -name faust.dll); do
          if MSYS_NO_PATHCONV=1 dumpbin /dependents "$dll" | grep -i llvm; then
            echo "::error::$dll depends on a shared LLVM"
            exit 1
          fi
        done

    - name: Make distribution
      shell: cmd
      run: |
        cd embedded/faustgen/package
        7z a -tzip faustgen-${{env.FAUSTGEN_VERSION}}-${{ matrix.name }}.zip faustgen-${{env.FAUSTGEN_VERSION}}-${{ matrix.name }}

    - name: Upload Faust installer
      uses: actions/upload-artifact@v4
      with:
        name: Faust-${{env.FAUST_VERSION}}-${{matrix.name}}.exe
        path: build/Faust-${{env.FAUST_VERSION}}-${{matrix.name}}.exe
        if-no-files-found: error

    - name: Upload faustgen~ artifact
      uses: actions/upload-artifact@v4
      with:
        name: faustgen-${{env.FAUSTGEN_VERSION}}-${{ matrix.name }}.zip
        path: embedded/faustgen/package/faustgen-${{env.FAUSTGEN_VERSION}}-${{ matrix.name }}.zip
        if-no-files-found: error

  create-release:
    if: ${{ inputs.create_release }} 
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    name: "Create Release on GitHub"
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: "dist"

      - uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: "dist/*/*"
