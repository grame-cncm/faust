[pytest]
# Pytest configuration for Faust JAX backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default test paths: the test_*.py files live directly in this directory.
testpaths = .

# Don't collect example/demo scripts or generated output as part of the suite.
norecursedirs = generated assets dsp .venv

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    # Uncomment for coverage reporting when pytest-cov is installed:
    # --cov=architecture/jax
    # --cov-report=term-missing
    # --cov-report=html

# Custom markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for full compilation and execution
    gradient: Gradient and automatic differentiation tests
    performance: Performance benchmarking tests
    slow: Tests that take significant time to run
    ci: Tests suitable for continuous integration
    xfail: Tests expected to fail (known issues)

# Minimum Python version
minversion = 6.0

# Warning filters
filterwarnings =
    error
    # Ignore specific third-party deprecation warnings
    ignore::DeprecationWarning:flax
    ignore::DeprecationWarning:jax
    ignore::DeprecationWarning:librosa
    # Ignore Python 3.13 stdlib deprecations from librosa dependencies
    ignore:'aifc' is deprecated.*:DeprecationWarning
    ignore:'audioop' is deprecated.*:DeprecationWarning
    ignore:path is deprecated.*:DeprecationWarning

# Timeout for tests (in seconds)
# Requires pytest-timeout package
# timeout = 300

# Parallel execution
# Requires pytest-xdist package
# Use: pytest -n auto
